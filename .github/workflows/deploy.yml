name: CI/CD Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: financas-production
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: financas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Test Database Migrations
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: financas_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: alembic upgrade head

      - name: Run Backend Tests
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: financas_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          RUN_INTEGRATION_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and Lint Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run lint

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR=/home/ubuntu/finan-as
            RELEASE_DIR=/home/ubuntu/finan-as-release

            # O diretório antigo pode conter backups, .env e alterações manuais.
            # O deploy usa uma cópia limpa para nunca sobrescrever esse conteúdo.
            if [ ! -d "$RELEASE_DIR/.git" ]; then
              git clone --branch main https://github.com/yagocanton21/finances.git "$RELEASE_DIR"
              PREVIOUS_REVISION="$(git -C "$RELEASE_DIR" rev-parse HEAD^)"
            else
              PREVIOUS_REVISION="$(git -C "$RELEASE_DIR" rev-parse HEAD)"
              git -C "$RELEASE_DIR" fetch origin main
            fi

            TARGET_REVISION="$(git -C "$RELEASE_DIR" rev-parse origin/main)"
            git -C "$RELEASE_DIR" checkout --detach "$TARGET_REVISION"

            if [ ! -f "$RELEASE_DIR/.env" ] && [ -f "$APP_DIR/.env" ]; then
              install -m 600 "$APP_DIR/.env" "$RELEASE_DIR/.env"
            fi

            sudo install -m 0755 "$RELEASE_DIR/ops/notify-deploy.sh" /usr/local/bin/financas-deploy-notify
            chmod 0755 "$RELEASE_DIR/ops/deploy-vps.sh"
            PROJECT_DIR="$RELEASE_DIR" \
            COMPOSE_PROJECT_NAME=finan-as \
            TARGET_REVISION="$TARGET_REVISION" \
            PREVIOUS_REVISION="$PREVIOUS_REVISION" \
              "$RELEASE_DIR/ops/deploy-vps.sh"

  alert_hermes_success:
    name: Alert Hermes on Success
    runs-on: ubuntu-latest
    if: success()
    needs: [test, deploy]

    steps:
      - name: Send Success Message through VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo /usr/local/bin/financas-deploy-notify \
              success \
              "${{ github.sha }}" \
              "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  alert_hermes_failure:
    name: Alert Hermes on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [test, deploy]

    steps:
      - name: Send Failure Message through VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo /usr/local/bin/financas-deploy-notify \
              failure \
              "${{ github.sha }}" \
              "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
