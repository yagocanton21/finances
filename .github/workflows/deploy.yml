name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: financas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Test Database Migrations
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: financas_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: alembic upgrade head

      - name: Run Backend Tests
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: financas_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          RUN_INTEGRATION_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and Lint Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run lint

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /home/ubuntu/finan-as
            cd /home/ubuntu/finan-as

            git init
            git remote add origin https://github.com/yagocanton21/finances.git || true
            git fetch origin
            git reset --hard origin/main

            docker compose up -d --build
            docker compose ps

  alert_hermes_failure:
    name: Alert Hermes on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [test, deploy]

    steps:
      - name: Send Webhook to Hermes
        env:
          HERMES_BOT_TOKEN: ${{ secrets.HERMES_BOT_TOKEN }}
          HERMES_CHAT_ID: ${{ secrets.HERMES_CHAT_ID }}
        run: |
          MESSAGE="ALERTA: o pipeline de Financas falhou. Verifique o GitHub Actions e a VPS."

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${HERMES_BOT_TOKEN}/sendMessage" \
            -d chat_id="${HERMES_CHAT_ID}" \
            -d text="${MESSAGE}"
